---
- name: Determine target runtime
  ansible.builtin.set_fact:
    redis_runtime_target: "{{ service_runtime | default('kubernetes') }}"
  tags:
    - redis

- name: Ensure redis namespace exists
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_manage_namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ redis_namespace }}"
  tags:
    - redis

- name: Validate password secret configuration
  ansible.builtin.assert:
    that:
      - redis_password_secret_name | length > 0
      - redis_password_secret_key | length > 0
    fail_msg: "redis_password_secret_name and redis_password_secret_key must be provided"
  tags:
    - redis

- name: Ensure password secret managed when requested
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_manage_password_secret
  kubernetes.core.k8s:
    state: present
    definition: {{ lookup('template', 'redis-password-secret.yml.j2') | from_yaml }}
  no_log: true
  tags:
    - redis

- name: Ensure ACL secret managed when requested
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_acl_enabled
    - redis_manage_acl_secret
  kubernetes.core.k8s:
    state: present
    definition: {{ lookup('template', 'redis-acl-secret.yml.j2') | from_yaml }}
  no_log: true
  tags:
    - redis

- name: Prepare service contract defaults
  ansible.builtin.set_fact:
    service_name: "{{ service_name | default(redis_name) }}"
    service_namespace: "{{ service_namespace | default(redis_namespace) }}"
    service_labels: {{ service_labels | default(redis_labels) }}
    service_runtime_templates: {{ service_runtime_templates | default(redis_runtime_templates) }}
    service_exports: {{ service_exports | default(redis_service_exports) }}
    service_ephemeral_mounts: {{ service_ephemeral_mounts | default(redis_ephemeral_mounts) }}
  tags:
    - redis

- name: Render Redis runtime configuration
  ansible.builtin.include_role:
    name: common.render_runtime
  vars:
    service_runtime: "{{ redis_runtime_target }}"
  register: redis_runtime_render
  tags:
    - redis

- name: Apply Redis runtime configuration
  ansible.builtin.include_role:
    name: common.apply_runtime
  vars:
    service_runtime: "{{ redis_runtime_target }}"
    service_runtime_objects: {{ redis_runtime_render.service_runtime_objects | default([]) }}
  tags:
    - redis
