---
- name: Determine target runtime
  ansible.builtin.set_fact:
    redis_runtime_target: "{{ service_runtime | default('kubernetes') }}"
  tags:
    - redis

- name: Ensure redis namespace exists
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_manage_namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ redis_namespace }}"
  tags:
    - redis

- name: Fail when TLS requested for LXC runtime
  when:
    - redis_runtime_target == 'lxc'
    - redis_tls_enabled
  ansible.builtin.fail:
    msg: "TLS is not supported for the LXC runtime"
  tags:
    - redis

- name: Validate password secret configuration
  ansible.builtin.assert:
    that:
      - redis_password_secret_name | length > 0
      - redis_password_secret_key | length > 0
    fail_msg: "redis_password_secret_name and redis_password_secret_key must be provided"
  tags:
    - redis

- name: Ensure at least one Redis listener is enabled
  ansible.builtin.assert:
    that:
      - redis_enable_plaintext_port or redis_tls_enabled
    fail_msg: "Either the plaintext port or TLS port must be enabled"
  tags:
    - redis

- name: Verify TLS secret exists before deployment
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_tls_enabled
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ redis_tls_cert_secret_name }}"
    namespace: "{{ redis_namespace }}"
  register: redis_tls_secret_info
  changed_when: false
  failed_when: (redis_tls_secret_info.resources | default([])) | length == 0
  tags:
    - redis

- name: Validate Redis operating mode
  ansible.builtin.assert:
    that:
      - redis_mode == 'standalone'
    fail_msg: "redis_mode '{{ redis_mode }}' is not supported by this role yet"
  tags:
    - redis

- name: Build effective ACL user list
  when: redis_acl_enabled
  vars:
    _acl_users: |-
      {% set users = redis_acl_users | list %}
      {% if redis_acl_create_default_password_user and (redis_password | default('') | length > 0) %}
      {%   set default_user = {
            'name': redis_acl_default_user_name,
            'commands': redis_acl_default_user_commands,
            'keys': redis_acl_default_user_keys,
            'channels': redis_acl_default_user_channels,
            'passwords': [redis_password],
            'enabled': redis_acl_default_user_enabled
          } %}
      {%   set _ = users.append(default_user) %}
      {% endif %}
      {{ users }}
  ansible.builtin.set_fact:
    redis_acl_users_effective: "{{ _acl_users | from_yaml }}"
  tags:
    - redis

- name: Ensure ACL user list empty when ACLs disabled
  when: not redis_acl_enabled
  ansible.builtin.set_fact:
    redis_acl_users_effective: []
  tags:
    - redis

- name: Prepare ACL configuration content
  when: redis_acl_enabled
  vars:
    _acl_from_template: "{{ lookup('template', 'redis-acl.conf.j2') }}"
  ansible.builtin.set_fact:
    redis_acl_effective_content: "{{ (redis_acl_content | trim) if (redis_acl_content | length > 0) else (_acl_from_template | trim) }}\n"
  tags:
    - redis

- name: Ensure ACL content empty when ACLs disabled
  when: not redis_acl_enabled
  ansible.builtin.set_fact:
    redis_acl_effective_content: ""
  tags:
    - redis

- name: Validate ACL user definitions
  when:
    - redis_acl_enabled
    - redis_acl_content | length == 0
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
    fail_msg: "ACL users must define a non-empty name"
  loop: "{{ redis_acl_users }}"
  loop_control:
    label: "{{ item.name | default('') }}"
  tags:
    - redis

- name: Ensure ACL configuration defines an enabled user
  when:
    - redis_acl_enabled
    - redis_acl_content | length == 0
  ansible.builtin.assert:
    that:
      - (redis_acl_users_effective | selectattr('enabled', 'defined') | selectattr('enabled') | list | length) > 0
    fail_msg: "ACLs are enabled but no enabled users were defined. Provide redis_password or customize redis_acl_users."
  tags:
    - redis

- name: Validate appendonlydir sizeLimit quantity
  vars:
    redis_appendonly_size_limit: "{{ redis_ephemeral_mounts.get('appendonlydir', {}).get('kubernetes', {}).get('size_limit', '') }}"
  when:
    - redis_appendonly_size_limit | length > 0
  ansible.builtin.assert:
    that:
      - redis_appendonly_size_limit is match('^\\d+(?:Ei|Pi|Ti|Gi|Mi|Ki)$')
    fail_msg: "redis_ephemeral_mounts.appendonlydir.kubernetes.size_limit must be a valid Kubernetes quantity (e.g. 64Mi, 1Gi)"
  tags:
    - redis

- name: Create temporary ACL file for validation
  when:
    - redis_acl_enabled
    - redis_acl_validate
  ansible.builtin.tempfile:
    state: file
    suffix: .acl
  register: redis_acl_validation_tempfile
  tags:
    - redis

- name: Write ACL content to validation file
  when:
    - redis_acl_enabled
    - redis_acl_validate
  ansible.builtin.copy:
    dest: "{{ redis_acl_validation_tempfile.path }}"
    content: "{{ redis_acl_effective_content }}"
    mode: "0600"
  tags:
    - redis

- block:
    - name: Validate ACL syntax with local parser
      when: redis_acl_validator_command | length == 0
      ansible.builtin.command: >-
        {{ ansible_playbook_python | default('python3') }}
        {{ role_path }}/files/redis_acl_validator.py
        {{ redis_acl_validation_tempfile.path }}
      register: redis_acl_validation_result
      changed_when: false

    - name: Run custom ACL validation command
      when: redis_acl_validator_command | length > 0
      ansible.builtin.shell: "{{ redis_acl_validator_command | replace('%ACL_FILE%', redis_acl_validation_tempfile.path) }}"
      args:
        executable: /bin/sh
      register: redis_acl_validation_result
      changed_when: false

    - name: Mark ACL validation success
      ansible.builtin.set_fact:
        redis_acl_validation_succeeded: true
  rescue:
    - name: Display ACL validation failure details
      ansible.builtin.debug:
        msg:
          - "ACL validation failed"
          - "Validator output: {{ redis_acl_validation_result.stderr | default('') }}"
          - "ACL file preserved at {{ redis_acl_validation_tempfile.path }} for troubleshooting"
          - "ACL preview: {{ redis_acl_effective_content.splitlines()[:10] }}"
      failed_when: true
  when:
    - redis_acl_enabled
    - redis_acl_validate
    - redis_acl_validation_tempfile is defined
  tags:
    - redis

- name: Remove temporary ACL validation file
  when:
    - redis_acl_enabled
    - redis_acl_validate
    - redis_acl_validation_tempfile is defined
    - redis_acl_validation_succeeded | default(false)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ redis_acl_validation_tempfile.path }}"
  tags:
    - redis

- name: Discover pods labeled for Redis access
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_network_policy_enabled
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: all
    label_selectors:
      - "shma.dev/redis-access=true"
  register: redis_access_pod_info
  failed_when: false
  changed_when: false
  tags:
    - redis

- name: Summarize labeled Redis access pods
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_network_policy_enabled
  vars:
    _pods_yaml: |-
      {% set pods = [] %}
      {% for pod in redis_access_pod_info.resources | default([]) %}
      {%   set namespace = pod.metadata.namespace | default('') %}
      {%   set name = pod.metadata.name | default('') %}
      {%   set identifier = (namespace + '/' if namespace else '') + name %}
      {%   set _ = pods.append(identifier) %}
      {% endfor %}
      {{ pods }}
  ansible.builtin.set_fact:
    redis_network_policy_access_pods: "{{ _pods_yaml | from_yaml }}"
  tags:
    - redis

- name: Ensure redis access pod list is defined when discovery skipped
  when:
    - redis_network_policy_access_pods is not defined
  ansible.builtin.set_fact:
    redis_network_policy_access_pods: []
  tags:
    - redis

- name: Ensure password secret managed when requested
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_manage_password_secret
  kubernetes.core.k8s:
    state: present
    definition: {{ lookup('template', 'redis-password-secret.yml.j2') | from_yaml }}
  no_log: true
  tags:
    - redis

- name: Ensure ACL secret managed when requested
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_acl_enabled
    - redis_manage_acl_secret
  kubernetes.core.k8s:
    state: present
    definition: {{ lookup('template', 'redis-acl-secret.yml.j2') | from_yaml }}
  no_log: true
  tags:
    - redis

- name: Ensure backup PVC is provided when backups are enabled
  when:
    - redis_backup_enabled
    - redis_backup_pvc_name | length == 0
  ansible.builtin.fail:
    msg: "Provide redis_backup_pvc_name so the backup job can persist artifacts"
  tags:
    - redis

- name: Prepare service contract defaults
  ansible.builtin.set_fact:
    service_name: "{{ service_name | default(redis_name) }}"
    service_namespace: "{{ service_namespace | default(redis_namespace) }}"
    service_labels: {{ service_labels | default(redis_labels) }}
    service_runtime_templates: {{ service_runtime_templates | default(redis_runtime_templates) }}
    service_exports: {{ service_exports | default(redis_service_exports) }}
    service_ephemeral_mounts: {{ service_ephemeral_mounts | default(redis_ephemeral_mounts) }}
  tags:
    - redis

- name: Render Redis runtime configuration
  ansible.builtin.include_role:
    name: common.render_runtime
  vars:
    service_runtime: "{{ redis_runtime_target }}"
  register: redis_runtime_render
  tags:
    - redis

- name: Apply Redis runtime configuration
  ansible.builtin.include_role:
    name: common.apply_runtime
  vars:
    service_runtime: "{{ redis_runtime_target }}"
    service_runtime_objects: {{ redis_runtime_render.service_runtime_objects | default([]) }}
  tags:
    - redis

- name: Reload Redis ACLs when configuration changes
  when:
    - redis_runtime_target == 'kubernetes'
    - redis_acl_enabled
  kubernetes.core.k8s_exec:
    namespace: "{{ redis_namespace }}"
    pod: "{{ redis_statefulset_name }}-0"
    container: redis
    command:
      - sh
      - -c
      - >-
        REDIS_PASSWORD="$(cat /run/redis-password/password)" &&
{% if redis_tls_enabled %}
        redis-cli --tls --cert {{ redis_tls_mount_path }}/{{ redis_tls_cert_secret_cert_key }} --key {{ redis_tls_mount_path }}/{{ redis_tls_cert_secret_key_key }} --cacert {{ redis_tls_mount_path }}/{{ redis_tls_cert_secret_ca_key }} -a "$REDIS_PASSWORD" -h 127.0.0.1 -p {{ redis_tls_port }} ACL LOAD
{% else %}
        redis-cli -a "$REDIS_PASSWORD" -h 127.0.0.1 -p {{ redis_port }} ACL LOAD
{% endif %}
  ignore_errors: true
  tags:
    - redis
